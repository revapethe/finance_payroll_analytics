services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: payroll
      POSTGRES_USER: payroll_owner
      POSTGRES_PASSWORD: ${PAYROLL_POSTGRES_PASSWORD:?Run python -m etl.dev_database first}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - payroll_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll_owner -d payroll"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  payroll_postgres:
