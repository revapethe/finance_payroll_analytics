name: Payroll checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: payroll_test
          POSTGRES_USER: postgres
          # Trust is scoped to this ephemeral CI service; local development uses random passwords.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d payroll_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PAYROLL_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/payroll_test
      PAYROLL_TEST_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -r requirements-rag.txt
      - run: ruff check app etl tests
      - run: ruff format --check app etl tests
      - run: python -m pytest -q
      - run: python -m pip check
